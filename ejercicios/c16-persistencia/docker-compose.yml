services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "5555:5555" # Puerto para Prisma Studio (visualizador de base de datos)
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/prisma.config.ts:/app/prisma.config.ts
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/libreria_db
      - CHECKPOINT_DISABLE=1
      - PRISMA_HIDE_UPDATE_MESSAGE=1
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=libreria_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libreria_db"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
